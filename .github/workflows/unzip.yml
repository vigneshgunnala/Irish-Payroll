name: Unzip project
on:
  push:
    paths: ['.github/workflows/unzip.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          ZIP="$(ls -1 *.zip | head -n 1)"
          echo "Found: $ZIP"
          rm -rf /tmp/x
          unzip -o -q "$ZIP" -d /tmp/x
          cp -a /tmp/x/irish-payroll/. .
          rm -f "$ZIP"
          git config user.name "vigneshgunnala"
          git config user.email "vigneshgunnala@users.noreply.github.com"
          git add -A
          git commit -m "Update Irish Payroll project files"
          git push
