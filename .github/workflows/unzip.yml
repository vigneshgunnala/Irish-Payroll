name: Unzip project
on:
  push:
    paths: ['.github/workflows/unzip.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -o -q irish-payroll.zip -d /tmp/x
          cp -a /tmp/x/irish-payroll/. .
          rm -f irish-payroll.zip
          git config user.name "vigneshgunnala"
          git config user.email "vigneshgunnala@users.noreply.github.com"
          git add -A
          git commit -m "Add Irish Payroll project files"
          git push
