[project]
name = "irish-payroll"
version = "1.0.0"
description = "Irish Payroll Management & Compliance System - portfolio prototype"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["B008", "E731", "B905", "UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
"ui/*" = ["E501"]
"app/services/payslips.py" = ["E501"]  # inline HTML/CSS template

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["app/engine", "app/rules"]
